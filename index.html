<!DOCTYPE html>
<html>

<head>

    <title>My Cloud Application</title>

    <style>

        body {
            font-family: Arial;
            background: #f2f2f2;
            text-align: center;
            padding-top: 80px;
        }

        .box {
            width: 400px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #aaa;
        }

        h1 {
            color: #333;
        }

        button {
            padding: 12px 25px;
            border: none;
            background: #333;
            color: white;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: #555;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
        }

    </style>

</head>

<body>

    <div class="box">

        <h1>Cloud Application</h1>

        <p>Welcome to my deployed web application!</p>

        <button onclick="showMessage()">
            Click Me
        </button>

        <p id="message"></p>

    </div>


    <script>

        function showMessage() {

            document.getElementById("message").innerText =
                "Application is working successfully!";

        }

    </script>

</body>

</html>
